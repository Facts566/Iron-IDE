plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.fxmisc.richtext:richtextfx:0.11.7'
}

javafx {
    version "17"
    modules = ["javafx.controls", "javafx.fxml"]
}

application {
    mainClass = 'Main'
}