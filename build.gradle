plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '3.2.1'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.fxmisc.richtext:richtextfx:0.11.7'
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.fxml']
}

// Принудительно заставляем Gradle выбирать JAR-файлы с классификатором 'linux',
// чтобы jlink не подхватывал пустые мета-пакеты OpenJFX
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.openjfx') {
            details.artifactSelection {
                it.selectArtifact('jar', null, 'linux')
            }
        }
    }
}

application {
    mainClass = 'app.Main'
    mainModule = 'test'
}


jlink {
    addExtraDependencies("javafx")

    launcher {
        name = 'Iron'
    }
}

